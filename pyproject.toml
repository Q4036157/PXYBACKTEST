[project]
name = "pxybacktest"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.0",
  "pydantic==2.10.0",
  "uvicorn[standard]==0.32.0",
  "pyarrow>=16,<24",
  "polars>=1.30,<2",
  "tzdata>=2025.2",
  "optuna>=4.0,<5",
]

[project.scripts]
pxybacktest = "app.cli:main"

[project.optional-dependencies]
test = [
  "httpx>=0.27",
  "pytest==8.3.0",
]
ml = [
  "lightgbm>=4.0,<5",
  "torch>=2.2,<3",
]
research = [
  "pyqlib>=0.9.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
